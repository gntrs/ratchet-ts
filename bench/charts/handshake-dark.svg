<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="568" viewBox="0 0 1000 568" role="img" aria-label="Full handshake (invite + accept + open), median ms per machine, lower is better: Apple M4 0.88 (v0.4.0, measured, on AC, free to boost), Ryzen 5 7530U 4.44 (v0.4.0, measured, on battery at 1890 MHz base clock), Apple M1 6.20 (v0.1.0, pre-0.3.3, power state not recorded), Core i5-12500H 6.50 (v0.2.0, pre-0.3.3, power state not recorded), Core i5-12450H 7.00 (v0.2.0, pre-0.3.3, power state not recorded), Ryzen 7 5800X3D 7.30 (v0.2.0, pre-0.3.3, power state not recorded), EPYC 9354P 32-core 8.90 (v0.2.0, pre-0.3.3, power state not recorded), Core i5-10400F 10.90 (v0.2.0, pre-0.3.3, power state not recorded), Core i5-10400F 11.50 (v0.2.0, pre-0.3.3, power state not recorded). Only the Apple M4 and Ryzen 5 7530U rows are measured on 0.4.0. Every inherited row predates the native curve and hash backends added in 0.3.3 and none recorded a power state, so the distance between them and the measured rows mixes version, backend and CPU clock together and is not a clean hardware ranking. The measured rows are not comparable to each other either: Apple M4 on AC, free to boost, Ryzen 5 7530U on battery at 1890 MHz base clock, so the distance between them is a power state stacked on a difference in hardware. Absolute milliseconds on the Ryzen 5 7530U row are power-state dependent: it was taken on battery at 1890 MHz base clock against a 4.5 GHz boost ceiling, so the same code on mains power is considerably quicker.">
  <rect width="1000" height="568" fill="#0d1117"/>
  <defs>
    <pattern id="stale" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#0d1117"/>
      <rect width="3" height="6" fill="#6e7781"/>
    </pattern>
  </defs>
  <text x="16" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Full handshake (invite + accept + open)</text>
  <text x="16" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">median ms · lower is better · single thread, no tuning · mixed versions and mixed power states, read the legend</text>

  <rect x="16" y="53" width="12" height="12" rx="2" fill="#4493f8"/>
  <text x="34" y="63" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">measured on 0.4.0, on AC and free to boost, 256 B payload, 2026-08-15</text>
  <rect x="16" y="71" width="12" height="12" rx="2" fill="#d29922"/>
  <text x="34" y="81" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">measured on 0.4.0, on battery at 1890 MHz base clock against a 4.5 GHz ceiling, 256 B payload, 2026-08-09</text>
