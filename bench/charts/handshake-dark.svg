<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" viewBox="0 0 760 496" role="img" aria-label="Full handshake (invite + accept + open), median ms per machine, lower is better: Ryzen 5 7530U 1.85 (v0.3.4, measured), Apple M1 6.20 (v0.1.0, pre-0.3.3), Core i5-12500H 6.50 (v0.2.0, pre-0.3.3), Core i5-12450H 7.00 (v0.2.0, pre-0.3.3), Ryzen 7 5800X3D 7.30 (v0.2.0, pre-0.3.3), EPYC 9354P 32-core 8.90 (v0.2.0, pre-0.3.3), Core i5-10400F 10.90 (v0.2.0, pre-0.3.3), Core i5-10400F 11.50 (v0.2.0, pre-0.3.3). Only the Ryzen 5 7530U row is measured on 0.3.4; the rest predate the native curve and hash backends added in 0.3.3. The same laptop measured 7.6 ms on 0.2.0 and 1.85 ms on 0.3.4, so the inherited rows overstate the handshake by roughly 4x.">
  <rect width="760" height="496" fill="#0d1117"/>
  <defs>
    <pattern id="stale" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#0d1117"/>
      <rect width="3" height="6" fill="#6e7781"/>
    </pattern>
  </defs>
  <text x="16" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Full handshake (invite + accept + open)</text>
  <text x="16" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">median ms · lower is better · single thread, no tuning · mixed versions, read the legend</text>

  <rect x="16" y="63" width="12" height="12" rx="2" fill="#4493f8"/>
  <text x="34" y="73" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9198a1">measured on 0.3.4, one machine, 256 B payload, 2026-08-08</text>
