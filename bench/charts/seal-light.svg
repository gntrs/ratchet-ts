  <text x="16" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">median ms · lower is better · single thread, no tuning · mixed versions, read the legend</text>

