<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" viewBox="0 0 760 496" role="img" aria-label="seal, one steady-state send, median ms per machine, lower is better: Apple M1 0.0190 (v0.1.0, pre-0.3.3), Ryzen 5 7530U 0.0201 (v0.3.4, measured), Core i5-12450H 0.0230 (v0.2.0, pre-0.3.3), Core i5-12500H 0.0250 (v0.2.0, pre-0.3.3), Ryzen 7 5800X3D 0.0280 (v0.2.0, pre-0.3.3), Core i5-10400F 0.0420 (v0.2.0, pre-0.3.3), EPYC 9354P 32-core 0.0500 (v0.2.0, pre-0.3.3), Core i5-10400F 0.0530 (v0.2.0, pre-0.3.3). Only the Ryzen 5 7530U row is measured on 0.3.4; the rest predate the native curve and hash backends added in 0.3.3. The inherited rows did not record their payload size, so they are not directly comparable to the 256 B measured row.">
  <rect width="760" height="496" fill="#ffffff"/>
  <defs>
