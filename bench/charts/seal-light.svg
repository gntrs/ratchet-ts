<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="568" viewBox="0 0 1000 568" role="img" aria-label="seal, one steady-state send, median ms per machine, lower is better: Apple M4 0.0046 (v0.4.0, measured, on AC, free to boost), Apple M1 0.0190 (v0.1.0, pre-0.3.3, power state not recorded), Core i5-12450H 0.0230 (v0.2.0, pre-0.3.3, power state not recorded), Core i5-12500H 0.0250 (v0.2.0, pre-0.3.3, power state not recorded), Ryzen 7 5800X3D 0.0280 (v0.2.0, pre-0.3.3, power state not recorded), Ryzen 5 7530U 0.0355 (v0.4.0, measured, on battery at 1890 MHz base clock), Core i5-10400F 0.0420 (v0.2.0, pre-0.3.3, power state not recorded), EPYC 9354P 32-core 0.0500 (v0.2.0, pre-0.3.3, power state not recorded), Core i5-10400F 0.0530 (v0.2.0, pre-0.3.3, power state not recorded). Only the Apple M4 and Ryzen 5 7530U rows are measured on 0.4.0. The inherited rows recorded neither their payload size nor their power state, so they are not directly comparable to the 256 B measured rows. The measured rows are not comparable to each other either: Apple M4 on AC, free to boost, Ryzen 5 7530U on battery at 1890 MHz base clock, so the distance between them is a power state stacked on a difference in hardware. Absolute milliseconds on the Ryzen 5 7530U row are power-state dependent: it was taken on battery at 1890 MHz base clock against a 4.5 GHz boost ceiling, so the same code on mains power is considerably quicker.">
