      <rect width="6" height="6" fill="#ffffff"/>
      <rect width="3" height="6" fill="#8c959f"/>
    </pattern>
  </defs>
  <text x="16" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328">seal, one steady-state send</text>
  <text x="16" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">median ms · lower is better · single thread, no tuning · mixed versions and mixed power states, read the legend</text>

  <rect x="16" y="53" width="12" height="12" rx="2" fill="#2563eb"/>
