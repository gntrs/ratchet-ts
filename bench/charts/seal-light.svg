<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-label="seal, one steady-state send, median ms per machine, lower is better: Apple M4 0.0048 (v0.6.0, measured, on AC, free to boost), Apple M1 0.0190 (v0.1.0, not re-measured, power state not recorded), Core i5-12450H 0.0230 (v0.2.0, not re-measured, power state not recorded), Core i5-12500H 0.0250 (v0.2.0, not re-measured, power state not recorded), Ryzen 7 5800X3D 0.0280 (v0.2.0, not re-measured, power state not recorded), Ryzen 5 7530U 0.0355 (v0.4.0, not re-measured, on battery at 1890 MHz base clock), Core i5-10400F 0.0420 (v0.2.0, not re-measured, power state not recorded), EPYC 9354P 32-core 0.0500 (v0.2.0, not re-measured, power state not recorded), Core i5-10400F 0.0530 (v0.2.0, not re-measured, power state not recorded). Only the Apple M4 row is measured on 0.6.0. The inherited rows recorded neither their payload size nor their power state, so they are not directly comparable to the 256 B measured rows. Unlike the handshake, the seal path did not change in 0.6.0: signatures are a per conversation cost, not a per message one.">
  <rect width="1000" height="550" fill="#ffffff"/>
  <defs>
    <pattern id="stale" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <rect width="3" height="6" fill="#8c959f"/>
    </pattern>
  </defs>
  <text x="16" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328">seal, one steady-state send</text>
  <text x="16" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">median ms · lower is better · single thread, no tuning · mixed versions and mixed power states, read the legend</text>

  <rect x="16" y="53" width="12" height="12" rx="2" fill="#2563eb"/>
  <text x="34" y="63" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">measured on 0.6.0, on AC and free to boost, 256 B payload, 2026-08-16</text>
