<text x="22.0" y="284.0" fill="#c9d1d9" xml:space="preserve">ML-KEM,&#160;both&#160;directions,&#160;which&#160;only&#160;this&#160;verifier&#160;can&#160;do</text>
<text x="22.0" y="303.0" fill="#c9d1d9" xml:space="preserve">&#160;&#160;ok&#160;&#160;&#160;ML-KEM-768&#160;ciphertext,&#160;re-encapsulated</text>
