<text x="22.0" y="911.0" fill="#c9d1d9" xml:space="preserve">all&#160;28&#160;checks&#160;passed.&#160;RustCrypto&#160;ML-KEM&#160;both&#160;directions,&#160;no&#160;shared&#160;code.</text>
