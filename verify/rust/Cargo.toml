[package]
name = "ratchet-verify"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ml-kem = { version = "0.2.1", features = ["deterministic"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.8"
chacha20poly1305 = "0.10.1"
serde_json = "1.0"
hex = "0.4.3"
base64 = "0.22.1"
