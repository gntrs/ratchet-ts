name: release

# Publishes to npm with a Sigstore provenance attestation.
#
# WHAT PROVENANCE BUYS, AND WHY THIS FILE EXISTS AT ALL
#
# Anyone can read this repository and conclude the code is fine. That tells them
# nothing about the tarball npm serves, because the two are only connected by
# the author's word that he ran `npm publish` from this source and nothing else.
# A publish with provenance closes that gap: npm records a signed statement,
# countersigned into Sigstore's public transparency log, naming the exact commit
# SHA, the exact workflow file, and the runner that built it. The npm page then
# shows a "Built and signed on GitHub Actions" badge linking back to the run.
#
# So the check a stranger can run becomes: read the source here, then verify the
# published artifact was built from this commit, without trusting the author for
# either half. That is the difference between "trust me" and "check it".
#
#   npm view ratchet-ts --json | jq .dist.attestations
#   npm audit signatures
#
# ONE TIME SETUP, WHICH ONLY THE PACKAGE OWNER CAN DO
#
# This workflow authenticates with npm trusted publishing (OIDC), so there is no
# NPM_TOKEN in this repository and no long lived credential to leak or rotate.
# The runner proves which workflow, in which repository, at which commit it is,
# and npm decides whether that identity is allowed to publish this package.
#
# Configured once at npmjs.com/package/ratchet-ts/access, under Trusted
# Publisher:
#
#   Publisher          GitHub Actions
#   Organization       gntrs
#   Repository         ratchet-ts
#   Workflow filename  release.yml
#   Environment        (leave empty)
#   Allowed actions    npm publish
#
# The workflow filename there and the name of THIS FILE have to stay in step.
# Renaming this file silently breaks releases, and the failure is an auth error
# that looks like a token problem rather than a rename, so if a release ever
# fails to authenticate, check that first.
#
# Provenance is a separate thing from authentication and does not depend on any
# of the above. The signed attestation comes from the OIDC token minted by
# `id-token: write`, so it would be identical under a plain npm token. Trusted
# publishing is what removes the credential, not what makes the signature worth
# anything.

on:
  push:
    tags:
      - 'v*'
  # Manual runs exist so a release can be rehearsed without cutting a tag. There
  # is deliberately no dry_run input: the publish step is gated on the ref being
  # a tag, so a manual run cannot publish no matter what anyone passes it. An
  # input that only restates a condition already enforced elsewhere is a second
  # place for the two to disagree.
  workflow_dispatch:

permissions:
  contents: read
  # Required for provenance. Without it the OIDC token is never minted and
  # --provenance fails rather than silently publishing an unsigned tarball.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer, which is well past the one
      # bundled with Node 22, so this line is load bearing rather than hygiene.
      # Latest rather than a pin because this is the credential path and it
      # should track upstream fixes.
      - run: npm install -g npm@latest

      - run: npm ci

      # The full gate, repeated here rather than assumed from the ci workflow.
      # A tag can point at a commit ci never ran on, and a release is the last
      # place to find that out.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # The tag and package.json must agree. Publishing 0.6.1 under a v0.7.0 tag
      # would make the provenance attestation point at the wrong source, which
      # is worse than having no attestation, because it looks verified.
      - name: the tag must match the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      # What actually goes in the tarball, printed before it is sent. dist is
      # gitignored and built here, so this is the only place the file list can
      # be read, and a released package with a stray file in it is a bad look
      # for a crypto library.
      - name: show what is about to be published
        run: npm pack --dry-run

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
